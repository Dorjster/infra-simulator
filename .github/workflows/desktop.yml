# Desktop builds: tests first, then a macOS DMG built on macOS runners and a Windows Setup.exe built on
# a Windows runner. Artifacts are uploaded for every run; a GitHub release is published only for v* tags.
# Signing: set APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID (+ a Developer ID certificate in the
# keychain) for macOS notarization and WINDOWS_CERTIFICATE_FILE / WINDOWS_CERTIFICATE_PASSWORD for
# Windows. Without them the builds are unsigned (macOS Gatekeeper and Windows SmartScreen will warn).
name: desktop
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, arch: arm64, label: macos-apple-silicon }
          - { os: macos-15-intel, arch: x64, label: macos-intel }
          - { os: windows-latest, arch: x64, label: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: Install desktop toolchain
        working-directory: desktop
        run: npm ci
      - name: Build installers
        working-directory: desktop
        run: npm run make -- --arch=${{ matrix.arch }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_FILE: ${{ secrets.WINDOWS_CERTIFICATE_FILE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      # The app inside the DMG must carry a valid (ad-hoc or Developer ID) signature: a broken one makes
      # macOS report a downloaded app as "damaged" with no way to open it.
      - name: Verify the DMG's app signature (macOS)
        if: runner.os == 'macOS'
        run: |
          DMG=$(ls desktop/out/make/*.dmg | head -1)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/infra-dmg "$DMG"
          codesign --verify --deep --strict --verbose=2 "/tmp/infra-dmg/Infra Simulator.app"
          codesign -dv "/tmp/infra-dmg/Infra Simulator.app"
          hdiutil detach /tmp/infra-dmg
      # Install exactly as a player does: Setup.exe must finish, install under %LOCALAPPDATA% and create a
      # shortcut (the app handles the Squirrel --squirrel-install event and quits). The smoke test then runs
      # the installed copy.
      - name: Install with Setup.exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/out/make -Recurse -Filter '*Setup.exe' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '--silent' -PassThru
          if (-not $p.WaitForExit(180000)) { throw 'Setup.exe did not finish within 3 minutes' }
          "Setup.exe exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 15
          $exe = Get-ChildItem "$env:LOCALAPPDATA\infra_simulator" -Recurse -Filter 'infra-simulator.exe' -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -like '*app-*' } | Select-Object -First 1
          if (-not $exe) { throw 'The game was not installed under %LOCALAPPDATA%\infra_simulator' }
          $links = @("$env:APPDATA\Microsoft\Windows\Start Menu\Programs", [Environment]::GetFolderPath('Desktop')) | ForEach-Object { Get-ChildItem $_ -Recurse -Filter '*.lnk' -ErrorAction SilentlyContinue } | Where-Object { $_.Name -like '*Infra*' }
          if (-not $links) { throw 'Setup.exe created no Start menu or desktop shortcut' }
          $links | ForEach-Object { "Shortcut: $($_.FullName)" }
          Get-Process infra-simulator -ErrorAction SilentlyContinue | Stop-Process -Force
          "INSTALLED_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      # Launch the app on this OS and drive it (start screen, Level 0, Free Build racks, Continue, OS clipboard
      # paste, frame times with this runner's GPU — software on CI — clean quit). Report uploaded either way.
      - name: Packaged app smoke test
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p smoke && cd smoke && npm init -y > /dev/null && npm i playwright-core@1 --silent
          cp ../tests/browser/desktop-smoke.mjs .
          EXE="${INSTALLED_EXE:-$(ls ../desktop/out/*/infra-simulator.exe 2>/dev/null || ls ../desktop/out/*/*.app/Contents/MacOS/infra-simulator)}"
          node desktop-smoke.mjs "$EXE" ../desktop-smoke-${{ matrix.label }}.json | tee smoke.log
          code=${PIPESTATUS[0]}
          { echo "### Smoke test · ${{ matrix.label }}"; echo '```'; cat smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep '^FAIL' smoke.log | sed 's/^/::warning title=Smoke ${{ matrix.label }}::/' || true
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.label }}
          path: desktop-smoke-${{ matrix.label }}.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: infra-simulator-${{ matrix.label }}
          path: |
            desktop/out/make/**/*.dmg
            desktop/out/make/**/*.zip
            desktop/out/make/**/*Setup.exe
            desktop/out/make/**/*.nupkg
            desktop/out/make/**/RELEASES
          if-no-files-found: error
  # Publishes whatever built: one slow or failed platform never blocks the others' downloads.
  release:
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success'
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Name files by platform
        run: |
          mkdir release
          for d in artifacts/*; do label=$(basename "$d" | sed 's/^infra-simulator-//'); find "$d" -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*Setup.exe' \) | while read f; do base=$(basename "$f"); cp "$f" "release/${label}-${base// /-}"; done; done
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
